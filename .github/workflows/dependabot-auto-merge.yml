name: Dependabot 自动合并

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot-auto-merge:
    name: Dependabot 自动处理
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
    - name: 检出代码
      uses: actions/checkout@v6

    - name: 获取 Dependabot 元数据
      id: metadata
      uses: dependabot/fetch-metadata@v2
      with:
        github-token: "${{ secrets.GITHUB_TOKEN }}"

    - name: 设置 Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: 运行安全扫描
      run: |
        echo "🔒 运行安全扫描..."
        bandit -c pyproject.toml -r src/ || true
        pip-audit || true
      continue-on-error: true

    # ============================================================================
    # 自动批准策略
    # ============================================================================
    - name: 自动批准安全更新
      if: |
        steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
        contains(steps.metadata.outputs.dependency-names, 'security')
      run: gh pr review --approve "$PR_URL"
      env:
        PR_URL: ${{ github.event.pull_request.html_url }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # ============================================================================
    # 自动合并策略（仅安全更新和补丁）
    # ============================================================================
    - name: 启用自动合并（安全更新）
      if: |
        steps.metadata.outputs.update-type == 'version-update:semver-patch' &&
        (contains(steps.metadata.outputs.dependency-names, 'aiohttp') ||
         contains(steps.metadata.outputs.dependency-names, 'aiogram') ||
         contains(steps.metadata.outputs.dependency-names, 'sqlalchemy'))
      run: gh pr merge --auto --squash "$PR_URL"
      env:
        PR_URL: ${{ github.event.pull_request.html_url }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # ============================================================================
    # 添加标签和评论
    # ============================================================================
    - name: 添加标签（主要版本更新）
      if: steps.metadata.outputs.update-type == 'version-update:semver-major'
      run: |
        gh pr edit "$PR_URL" --add-label "major-update,needs-review"
        gh pr comment "$PR_URL" --body "⚠️ **主要版本更新** - 需要手动审查和测试！"
      env:
        PR_URL: ${{ github.event.pull_request.html_url }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 添加标签（次要版本更新）
      if: steps.metadata.outputs.update-type == 'version-update:semver-minor'
      run: |
        gh pr edit "$PR_URL" --add-label "minor-update"
        gh pr comment "$PR_URL" --body "ℹ️ **次要版本更新** - 建议审查后合并"
      env:
        PR_URL: ${{ github.event.pull_request.html_url }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 添加评论（补丁更新）
      if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
      run: |
        gh pr comment "$PR_URL" --body "✅ **补丁更新** - 安全扫描通过，可以安全合并"
      env:
        PR_URL: ${{ github.event.pull_request.html_url }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # 安全检查（Dependabot PR 必须通过）
  # ============================================================================
  security-check:
    name: 安全检查
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
    - name: 检出代码
      uses: actions/checkout@v6

    - name: 设置 Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: 运行 Bandit
      run: bandit -c pyproject.toml -r src/
      continue-on-error: false

    - name: 运行 pip-audit
      run: pip-audit
      continue-on-error: true

    - name: 运行测试
      run: pytest
      continue-on-error: true
