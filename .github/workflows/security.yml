name: 安全扫描 (Security Scan)

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  schedule:
    # 每周一凌晨 2 点运行
    - cron: '0 2 * * 1'

jobs:
  security-scan:
    name: 安全扫描
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v6

    - name: 设置 Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    # Bandit - Python 代码安全扫描
    - name: 运行 Bandit 安全扫描
      run: |
        bandit -r src/ -f json -o bandit-report.json || true
        bandit -r src/ -f txt
      continue-on-error: true

    # Safety - 依赖漏洞检查
    - name: 运行 Safety 依赖检查
      run: |
        set +e
        safety scan --output json > safety-report.json
        rc1=$?
        safety scan
        rc2=$?
        exit $((rc1 > rc2 ? rc1 : rc2))
      continue-on-error: true

    # pip-audit - Python 官方依赖漏洞扫描
    - name: 运行 pip-audit 依赖扫描
      run: |
        set +e
        pip-audit --format json --output pip-audit-report.json
        rc1=$?
        pip-audit --desc
        rc2=$?
        exit $((rc1 > rc2 ? rc1 : rc2))
      continue-on-error: true

    # Semgrep - 静态代码分析
    - name: 运行 Semgrep 扫描
      uses: semgrep/semgrep-action@v1
      with:
        config: >-
          p/python
          p/security-audit
          p/owasp-top-ten
      continue-on-error: true

    # Trivy - 容器镜像扫描
    - name: 构建 Docker 镜像
      run: |
        docker build -t tg-guard-bot:test .

    - name: 运行 Trivy 容器扫描
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'tg-guard-bot:test'
        format: 'sarif'
        output: 'trivy-results.sarif'
      continue-on-error: true

    - name: 上传 Trivy 结果到 GitHub Security
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
      continue-on-error: true

    # 上传报告为 artifacts
    - name: 上传安全扫描报告
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json
          pip-audit-report.json
          trivy-results.sarif
        retention-days: 30

    # 代码质量检查
    - name: 运行 Ruff Linter
      run: |
        ruff check src/ --output-format=github
      continue-on-error: true

    - name: 运行 MyPy 类型检查
      run: |
        mypy src/ --ignore-missing-imports
      continue-on-error: true

  dependency-review:
    name: 依赖审查
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - name: 检出代码
      uses: actions/checkout@v6

    - name: 依赖审查
      uses: actions/dependency-review-action@v4
      with:
        fail-on-severity: moderate
        deny-licenses: GPL-3.0, AGPL-3.0

  secret-scan:
    name: 密钥扫描
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: GitLeaks 密钥扫描
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
