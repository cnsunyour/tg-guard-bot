services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tg-guard-bot
    restart: unless-stopped
    # ✅ L1: 确保容器以非 root 用户运行
    user: "1000:1000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./data:/app/data  # 挂载整个 data 目录（包含 models 和 session 文件）
      - ./logs:/app/logs
      - ./config:/app/config
    networks:
      # 双网络：bot 是唯一能同时触达业务网与沙盒网的组件。
      # ⚠️ tg-guard-network 必须列在首位：默认路由（Telegram 出站）走首个
      # 连接的网络。不用 gw_priority（较新 compose 才支持，服务器旧版
      # docker-compose 会因未知属性直接校验失败）
      - tg-guard-network
      - sandbox-network

  # 沙盒执行服务：运行管理员自定义验证脚本，与 bot 主进程完全隔离
  # （独立镜像、独立 internal 网络、只读 rootfs、无能力、非 root）。
  # 安全模型与残余边界见 SECURITY.md「自定义验证脚本」一节
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    container_name: tg-guard-sandbox
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    tmpfs:
      # 每任务在 /tasks 下建独立 0700 子目录，结束即删；noexec 防落地可执行文件
      - /tasks:size=64m,noexec,uid=65534,gid=65534,mode=0700
    mem_limit: 512m
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      SANDBOX_API_KEY: ${SANDBOX_API_KEY:-}
    # 不挂 .env、不挂任何宿主目录、无 ports 暴露
    networks:
      - sandbox-network

  postgres:
    image: postgres:16-alpine
    container_name: tg-guard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      # ⚠️ 生产环境必须设置强密码！使用 .env 文件配置
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password must be set in .env file}
      POSTGRES_DB: ${DB_NAME:-tg_guard}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # ✅ 安全：已移除端口映射，仅允许 Docker 网络内访问
    # 如需本地调试，可临时取消下面两行注释：
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tg-guard-network

  redis:
    image: redis:7-alpine
    container_name: tg-guard-redis
    restart: unless-stopped
    # ⚠️ 生产环境必须设置强密码！使用 .env 文件配置
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Redis password must be set in .env file}
    volumes:
      - redisdata:/data
    # ✅ 安全：已移除端口映射，仅允许 Docker 网络内访问
    # 如需本地调试，可临时取消下面两行注释：
    # ports:
    #   - "127.0.0.1:6379:6379"
    networks:
      - tg-guard-network

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  tg-guard-network:
    driver: bridge
  # internal：无出站公网路由；沙盒容器与业务网（postgres/redis）物理隔离
  sandbox-network:
    driver: bridge
    internal: true
