<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0088cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#005580;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="botGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a884;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景圆 -->
  <circle cx="256" cy="256" r="240" fill="#f5f5f5" opacity="0.3"/>

  <!-- 盾牌主体 -->
  <path d="M 256 80
           L 380 120
           Q 390 130, 390 145
           L 390 280
           Q 390 350, 340 400
           Q 300 440, 256 460
           Q 212 440, 172 400
           Q 122 350, 122 280
           L 122 145
           Q 122 130, 132 120
           L 256 80 Z"
        fill="url(#shieldGradient)"
        stroke="#004466"
        stroke-width="4"/>

  <!-- 盾牌高光 -->
  <path d="M 256 90
           L 360 125
           Q 368 133, 368 145
           L 368 270
           Q 368 330, 330 370
           Q 295 405, 256 420"
        fill="none"
        stroke="#ffffff"
        stroke-width="3"
        opacity="0.3"/>

  <!-- 机器人头部 -->
  <rect x="200" y="200" width="112" height="100" rx="20" fill="url(#botGradient)" stroke="#ffffff" stroke-width="3"/>

  <!-- 机器人天线 -->
  <line x1="230" y1="200" x2="230" y2="175" stroke="#00d4aa" stroke-width="4" stroke-linecap="round"/>
  <circle cx="230" cy="170" r="8" fill="#00d4aa"/>
  <line x1="282" y1="200" x2="282" y2="175" stroke="#00d4aa" stroke-width="4" stroke-linecap="round"/>
  <circle cx="282" cy="170" r="8" fill="#00d4aa"/>

  <!-- 机器人眼睛 -->
  <circle cx="230" cy="240" r="14" fill="#ffffff"/>
  <circle cx="230" cy="240" r="8" fill="#004466"/>
  <circle cx="282" cy="240" r="14" fill="#ffffff"/>
  <circle cx="282" cy="240" r="8" fill="#004466"/>

  <!-- 机器人嘴巴 (笑脸) -->
  <path d="M 220 270 Q 256 285, 292 270" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

  <!-- 验证勾号 -->
  <g transform="translate(330, 350)">
    <circle r="35" fill="#00d4aa" opacity="0.9"/>
    <path d="M -12 0 L -4 10 L 14 -12" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
