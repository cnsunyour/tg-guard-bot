<?xml version="1.0" encoding="UTF-8"?>
<!-- 横版 Logo - 适合 GitHub README 横幅 -->
<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bannerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0088cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4aa;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="200" fill="#ffffff"/>

  <!-- 左侧图标 -->
  <g transform="translate(100, 100)">
    <!-- 盾牌 -->
    <path d="M 0 -60
             L 50 -45
             L 50 10
             Q 50 45, 0 65
             Q -50 45, -50 10
             L -50 -45
             L 0 -60 Z"
          fill="url(#bannerGradient)"
          opacity="0.9"/>
    <!-- 勾号 -->
    <path d="M -25 -5 L -10 12 L 28 -30"
          fill="none"
          stroke="#ffffff"
          stroke-width="8"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- 项目名称 -->
  <text x="200" y="95" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#0088cc">
    Telegram Guard Bot
  </text>

  <!-- 副标题 -->
  <text x="200" y="130" font-family="Arial, sans-serif" font-size="20" fill="#666666">
    🛡️ AI-Powered Group Protection • 智能群组防护机器人
  </text>

  <!-- 功能标签 -->
  <g transform="translate(200, 155)">
    <rect width="90" height="28" rx="14" fill="#0088cc" opacity="0.1"/>
    <text x="45" y="19" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#0088cc" text-anchor="middle">Anti-Spam</text>
  </g>
  <g transform="translate(300, 155)">
    <rect width="110" height="28" rx="14" fill="#00d4aa" opacity="0.1"/>
    <text x="55" y="19" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#00a884" text-anchor="middle">Verification</text>
  </g>
  <g transform="translate(420, 155)">
    <rect width="120" height="28" rx="14" fill="#0088cc" opacity="0.1"/>
    <text x="60" y="19" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#0088cc" text-anchor="middle">ML Detection</text>
  </g>
</svg>
