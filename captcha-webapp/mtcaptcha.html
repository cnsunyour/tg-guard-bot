<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTCaptcha 验证</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- MTCaptcha 配置（按照官方示例） -->
    <script>
        // 回调函数
        function mtcaptchaVerifiedCallback(token) {
            console.log('MTCaptcha verified:', token);
            if (window.handleVerification) {
                window.handleVerification(token.verifiedToken || token);
            }
        }

        function mtcaptchaErrorCallback(error) {
            console.error('MTCaptcha error:', error);
            if (window.handleError) {
                window.handleError();
            }
        }

        // MTCaptcha 配置
        var mtcaptchaConfig = {
            sitekey: new URLSearchParams(window.location.search).get('sitekey') || '',
            'verified-callback': 'mtcaptchaVerifiedCallback',
            'error-callback': 'mtcaptchaErrorCallback',
        };

        // 加载 SDK（官方方式）
        (function() {
            var mt_service = document.createElement('script');
            mt_service.async = true;
            mt_service.src = 'https://service.mtcaptcha.com/mtcv1/client/mtcaptcha.min.js';
            (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(mt_service);

            var mt_service2 = document.createElement('script');
            mt_service2.async = true;
            mt_service2.src = 'https://service2.mtcaptcha.com/mtcv1/client/mtcaptcha2.min.js';
            (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(mt_service2);
        })();
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }

        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--tg-theme-hint-color, #999);
            margin-bottom: 30px;
        }

        #captcha-widget {
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }

        .status.loading {
            display: block;
            background: #e3f2fd;
            color: #1976d2;
        }

        .status.success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status.error {
            display: block;
            background: #ffebee;
            color: #c62828;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 入群验证</h1>
        <p class="subtitle">请完成以下验证</p>

        <div id="captcha-widget">
            <!-- MTCaptcha 会自动渲染在这里 -->
            <div class="mtcaptcha"></div>
        </div>

        <div id="status" class="status"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // 获取参数
        const params = new URLSearchParams(window.location.search);
        const chatId = params.get('chat_id');
        const userId = params.get('user_id');
        const verifyToken = params.get('token');

        function showStatus(type, message) {
            const el = document.getElementById('status');
            el.className = `status ${type}`;
            el.textContent = message;
        }

        // 验证成功处理
        window.handleVerification = async function(captchaToken) {
            showStatus('loading', '验证中...');

            try {
                const response = await fetch('/api/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        provider: 'mtcaptcha',
                        captcha_response: captchaToken,
                        chat_id: chatId,
                        user_id: userId,
                        verify_token: verifyToken,
                    }),
                });

                const result = await response.json();

                if (result.success) {
                    showStatus('success', '✅ 验证成功！');

                    setTimeout(() => {
                        tg.sendData(JSON.stringify({
                            action: 'captcha_success',
                            provider: 'mtcaptcha',
                            chat_id: chatId,
                            user_id: userId,
                            verify_token: verifyToken,
                            signature: result.signature,
                            timestamp: result.timestamp,
                        }));
                        tg.close();
                    }, 800);
                } else {
                    showStatus('error', `❌ ${result.error || '验证失败'}`);
                }
            } catch (error) {
                console.error('Verification error:', error);
                showStatus('error', '❌ 网络错误，请重试');
            }
        };

        window.handleError = function() {
            showStatus('error', '❌ 验证加载失败');
        };
    </script>
</body>
</html>
