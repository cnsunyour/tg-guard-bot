<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title.turnstile">Turnstile 验证</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/i18n.js"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; padding: 20px;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }
        .container { text-align: center; max-width: 400px; width: 100%; }
        h1 { font-size: 24px; font-weight: 600; margin-bottom: 10px; }
        .subtitle { font-size: 14px; color: var(--tg-theme-hint-color, #999); margin-bottom: 30px; }
        #captcha-widget { min-height: 100px; display: flex; align-items: center; justify-content: center; }
        .status { margin-top: 20px; padding: 12px; border-radius: 8px; font-size: 14px; display: none; }
        .status.loading { display: block; background: #e3f2fd; color: #1976d2; }
        .status.success { display: block; background: #e8f5e9; color: #2e7d32; }
        .status.error { display: block; background: #ffebee; color: #c62828; }
    </style>
</head>
<body>
    <div class="container">
        <h1 data-i18n="heading">🔐 入群验证</h1>
        <p class="subtitle" data-i18n="subtitle">请完成以下验证</p>
        <div id="captcha-widget"></div>
        <div id="status" class="status"></div>
    </div>

    <script>
        applyTranslations();
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const params = new URLSearchParams(window.location.search);
        const chatId = params.get('chat_id');
        const userId = params.get('user_id');
        const verifyToken = params.get('token');

        function showStatus(type, message) {
            const el = document.getElementById('status');
            el.className = `status ${type}`;
            el.style.display = 'block';
            el.textContent = message;
        }

        (async function init() {
            try {
                showStatus('loading', t('status.loading_widget'));

                const response = await fetch(`/api/config?provider=turnstile`);
                const config = await response.json();

                if (!config.site_key) throw new Error('Failed to get site key');

                await new Promise(resolve => {
                    const check = setInterval(() => {
                        if (window.turnstile) { clearInterval(check); resolve(); }
                    }, 100);
                });

                window.turnstile.render('#captcha-widget', {
                    sitekey: config.site_key,
                    callback: async (token) => {
                        showStatus('loading', t('status.verifying'));
                        try {
                            const res = await fetch('/api/verify', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    provider: 'turnstile',
                                    captcha_response: token,
                                    chat_id: chatId,
                                    user_id: userId,
                                    verify_token: verifyToken,
                                }),
                            });
                            const result = await res.json();
                            if (result.success) {
                                showStatus('success', t('status.success'));
                                setTimeout(() => {
                                    tg.sendData(JSON.stringify({
                                        action: 'captcha_success',
                                        provider: 'turnstile',
                                        chat_id: chatId,
                                        user_id: userId,
                                        verify_token: verifyToken,
                                        signature: result.signature,
                                        timestamp: result.timestamp,
                                    }));
                                    tg.close();
                                }, 800);
                            } else {
                                console.warn('Backend verification failed:', result.error);
                                showStatus('error', t('status.failed'));
                            }
                        } catch (error) {
                            console.error('Verification error:', error);
                            showStatus('error', t('status.network_error'));
                        }
                    },
                    'error-callback': () => showStatus('error', t('status.widget_load_failed')),
                    theme: 'auto',
                });

                setTimeout(() => {
                    const statusEl = document.getElementById('status');
                    if (statusEl.classList.contains('loading')) {
                        statusEl.style.display = 'none';
                    }
                }, 1000);
            } catch (error) {
                console.error('Failed to initialize:', error);
                showStatus('error', t('status.init_failed'));
            }
        })();
    </script>
</body>
</html>
