<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title.friendly">Friendly Captcha 验证</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/i18n.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; padding: 20px;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }
        .container { text-align: center; max-width: 400px; width: 100%; }
        h1 { font-size: 24px; font-weight: 600; margin-bottom: 10px; }
        .subtitle { font-size: 14px; color: var(--tg-theme-hint-color, #999); margin-bottom: 30px; }
        #captcha-widget { min-height: 100px; display: flex; align-items: center; justify-content: center; }
        .status { margin-top: 20px; padding: 12px; border-radius: 8px; font-size: 14px; display: none; }
        .status.loading { display: block; background: #e3f2fd; color: #1976d2; }
        .status.success { display: block; background: #e8f5e9; color: #2e7d32; }
        .status.error { display: block; background: #ffebee; color: #c62828; }
    </style>
</head>
<body>
    <div class="container">
        <h1 data-i18n="heading">🔐 入群验证</h1>
        <p class="subtitle" data-i18n="subtitle">请完成以下验证</p>
        <div id="captcha-widget"></div>
        <div id="status" class="status"></div>
    </div>

    <script>
        applyTranslations();
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const params = new URLSearchParams(window.location.search);
        const chatId = params.get('chat_id');
        const userId = params.get('user_id');
        const verifyToken = params.get('token');
        const keyIndex = params.get('key_index') || 0;

        // Friendly Captcha SDK 使用 BCP47 语言标签（按地区），与 bot locale（按文字）映射
        const friendlyLocales = {
            'zh-Hans': 'zh',
            'zh-Hant': 'zh-TW',
            'en': 'en',
        };

        function showStatus(type, message) {
            const el = document.getElementById('status');
            el.className = `status ${type}`;
            el.style.display = 'block';
            el.textContent = message;
        }

        async function verifyWithBackend(solution) {
            showStatus('loading', t('status.verifying'));
            try {
                const res = await fetch('/api/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        provider: 'friendly',
                        captcha_response: solution,
                        chat_id: chatId,
                        user_id: userId,
                        verify_token: verifyToken,
                        key_index: keyIndex,
                    }),
                });
                const result = await res.json();

                if (result.success) {
                    showStatus('success', t('status.success'));
                    setTimeout(() => {
                        tg.sendData(JSON.stringify({
                            action: 'captcha_success',
                            provider: 'friendly',
                            chat_id: chatId,
                            user_id: userId,
                            verify_token: verifyToken,
                            signature: result.signature,
                            timestamp: result.timestamp,
                        }));
                        tg.close();
                    }, 800);
                } else {
                    console.warn('Backend verification failed:', result.error);
                    showStatus('error', t('status.failed'));
                }
            } catch (error) {
                console.error('Verification error:', error);
                showStatus('error', t('status.network_error'));
            }
        }

        (async function init() {
            try {
                showStatus('loading', t('status.loading_widget'));

                // 获取配置
                const response = await fetch(`/api/config?provider=friendly&key_index=${keyIndex}`);
                const config = await response.json();

                if (!config.site_key) {
                    throw new Error('Failed to get site key');
                }

                // 创建 widget 元素（带正确的 sitekey）
                const container = document.getElementById('captcha-widget');
                const widgetDiv = document.createElement('div');
                widgetDiv.id = 'frc-widget';
                widgetDiv.className = 'frc-captcha';
                widgetDiv.setAttribute('data-sitekey', config.site_key);
                widgetDiv.setAttribute('data-start', 'auto');
                widgetDiv.setAttribute('lang', friendlyLocales[getCurrentLocale()]);
                container.appendChild(widgetDiv);

                // 动态加载 SDK（在 widget 元素创建之后）
                const script1 = document.createElement('script');
                script1.type = 'module';
                script1.src = 'https://cdn.jsdelivr.net/npm/@friendlycaptcha/sdk@0.1.36/site.min.js';
                script1.async = true;
                script1.defer = true;
                document.head.appendChild(script1);

                const script2 = document.createElement('script');
                script2.setAttribute('nomodule', '');
                script2.src = 'https://cdn.jsdelivr.net/npm/@friendlycaptcha/sdk@0.1.36/site.compat.min.js';
                script2.async = true;
                script2.defer = true;
                document.head.appendChild(script2);

                // 添加事件监听器
                widgetDiv.addEventListener('frc:widget.complete', (event) => {
                    verifyWithBackend(event.detail.response);
                });

                widgetDiv.addEventListener('frc:widget.error', (event) => {
                    console.error('Friendly Captcha error:', event.detail);
                    showStatus('error', t('status.failed_refresh'));
                });

                widgetDiv.addEventListener('frc:widget.ready', (event) => {
                    console.log('Widget ready');
                });

                // 隐藏加载提示
                setTimeout(() => {
                    const statusEl = document.getElementById('status');
                    if (statusEl.classList.contains('loading')) {
                        statusEl.style.display = 'none';
                    }
                }, 1500);
            } catch (error) {
                console.error('Init error:', error);
                showStatus('error', t('status.init_failed'));
            }
        })();
    </script>
</body>
</html>
