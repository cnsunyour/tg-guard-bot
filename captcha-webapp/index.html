<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="index.title">Telegram Guard Bot - 验证服务</title>
    <script src="/i18n.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
        }

        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .subtitle {
            font-size: 18px;
            opacity: 0.9;
            margin-bottom: 32px;
        }

        .info {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            text-align: left;
        }

        .info h2 {
            font-size: 20px;
            margin-bottom: 12px;
        }

        .info ul {
            list-style: none;
            padding: 0;
        }

        .info li {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .info li:last-child {
            border-bottom: none;
        }

        .footer {
            font-size: 14px;
            opacity: 0.7;
            margin-top: 24px;
        }

        a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 data-i18n="index.heading">🔐 Telegram Guard Bot</h1>
        <p class="subtitle" data-i18n="index.subtitle">多验证码集成服务</p>

        <div class="info">
            <h2 data-i18n="index.supported_methods">支持的验证方式</h2>
            <ul>
                <li data-i18n="index.methods.turnstile">✅ Cloudflare Turnstile</li>
                <li data-i18n="index.methods.friendly">✅ Friendly Captcha v2</li>
                <li data-i18n="index.methods.hcaptcha">✅ hCaptcha</li>
                <li data-i18n="index.methods.mtcaptcha">✅ MTCaptcha</li>
                <li data-i18n="index.methods.altcha">✅ ALTCHA（工作量证明）</li>
            </ul>
        </div>

        <div class="info">
            <h2 data-i18n="index.architecture">技术架构</h2>
            <ul>
                <li data-i18n="index.arch.pages">🚀 Cloudflare Pages（前端托管）</li>
                <li data-i18n="index.arch.functions">⚡ Cloudflare Functions（验证 API）</li>
                <li data-i18n="index.arch.hmac">🔒 HMAC-SHA256 签名验证</li>
                <li data-i18n="index.arch.isolated">🌐 独立页面设计（避免 SDK 冲突）</li>
            </ul>
        </div>

        <p class="footer" data-i18n="index.footer">
            此页面仅供系统使用，请通过 Telegram Bot 访问验证服务
        </p>
    </div>
    <script>
        applyTranslations();
    </script>
</body>
</html>
