name = "tg-guard-turnstile"
compatibility_date = "2024-01-01"

# Pages 部署配置
pages_build_output_dir = "."

# Cloudflare Pages 配置
# 部署时需要在 Cloudflare Dashboard 中设置以下环境变量：
#
# 生产环境变量 (Settings → Environment variables → Production)：
# - TURNSTILE_SITE_KEY: 从 Cloudflare Turnstile 获取的 Site Key (公开，用于前端动态加载)
# - TURNSTILE_SECRET_KEY: 从 Cloudflare Turnstile 获取的 Secret Key (保密，用于后端验证)
# - SIGNATURE_KEY: 与 Bot 共享的签名密钥 (至少 32 字符，使用 openssl rand -hex 32 生成)
#
# 注意：所有敏感变量不要写在此文件中，必须在 Dashboard 中配置

[vars]
# 非敏感变量可以在这里配置
# EXAMPLE_VAR = "example_value"
