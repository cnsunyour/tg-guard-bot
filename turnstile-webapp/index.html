<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>入群验证</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
        }
        .container { text-align: center; max-width: 400px; }
        h1 { font-size: 24px; margin-bottom: 10px; }
        p { color: var(--tg-theme-hint-color, #666); margin-bottom: 20px; }
        .status { margin-top: 20px; font-size: 16px; min-height: 24px; }
        .success { color: #4CAF50; }
        .error { color: #f44336; }
        .loading { color: var(--tg-theme-hint-color, #666); }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 入群验证</h1>
        <p>请完成下方验证以加入群组</p>

        <!-- Turnstile Widget 将在此处动态渲染 -->
        <div id="turnstile-container"></div>

        <div id="status" class="status"></div>
    </div>

    <script>
        // 初始化 Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // 从 URL 获取参数
        const params = new URLSearchParams(window.location.search);
        const chatId = params.get('chat_id');
        const userId = params.get('user_id');
        const verifyToken = params.get('token');

        const status = document.getElementById('status');

        // 参数验证
        if (!chatId || !userId || !verifyToken) {
            status.className = 'status error';
            status.textContent = '❌ 验证参数无效';
        } else {
            // 初始化 Turnstile Widget
            initTurnstile();
        }

        // 初始化 Turnstile Widget
        async function initTurnstile() {
            status.className = 'status loading';
            status.textContent = '加载验证组件...';

            try {
                // 获取配置（包括 Site Key）
                const configResponse = await fetch('/api/config');
                const config = await configResponse.json();

                if (!config.success || !config.turnstile_site_key) {
                    throw new Error('无法获取验证配置');
                }

                // 等待 Turnstile 脚本加载完成
                await waitForTurnstile();

                // 动态渲染 Turnstile Widget
                window.turnstile.render('#turnstile-container', {
                    sitekey: config.turnstile_site_key,
                    callback: onTurnstileSuccess,
                    'error-callback': onTurnstileError,
                    theme: 'auto',
                });

                status.textContent = '';
            } catch (e) {
                status.className = 'status error';
                status.textContent = '❌ 加载失败，请刷新重试';
            }
        }

        // 等待 Turnstile 脚本加载
        function waitForTurnstile() {
            return new Promise((resolve) => {
                if (window.turnstile) {
                    resolve();
                } else {
                    const checkInterval = setInterval(() => {
                        if (window.turnstile) {
                            clearInterval(checkInterval);
                            resolve();
                        }
                    }, 100);
                }
            });
        }

        // Turnstile 验证成功回调
        async function onTurnstileSuccess(cfToken) {
            status.className = 'status loading';
            status.textContent = '验证中...';

            try {
                // 调用后端 API 验证并获取签名
                const response = await fetch('/api/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        user_id: userId,
                        verify_token: verifyToken,
                        cf_token: cfToken
                    })
                });

                const result = await response.json();

                if (result.success) {
                    status.className = 'status success';
                    status.textContent = '✅ 验证成功！';

                    // 发送签名数据给 Bot
                    setTimeout(() => {
                        tg.sendData(JSON.stringify({
                            action: 'turnstile_success',
                            chat_id: chatId,
                            user_id: userId,
                            verify_token: verifyToken,
                            signature: result.signature,
                            timestamp: result.timestamp
                        }));
                        tg.close();
                    }, 800);
                } else {
                    status.className = 'status error';
                    status.textContent = '❌ ' + (result.error || '验证失败，请重试');
                    // 重置 Turnstile
                    if (window.turnstile) {
                        window.turnstile.reset();
                    }
                }
            } catch (e) {
                status.className = 'status error';
                status.textContent = '❌ 网络错误，请重试';
                if (window.turnstile) {
                    window.turnstile.reset();
                }
            }
        }

        function onTurnstileError() {
            status.className = 'status error';
            status.textContent = '❌ 验证加载失败，请刷新重试';
        }
    </script>
</body>
</html>
