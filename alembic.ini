# ============================================================================
# Alembic 数据库迁移配置
#
# - sqlalchemy.url 故意留空，由 migrations/env.py 从 src.core.config.settings 注入，
#   避免密码等特殊字符在 ConfigParser 的 % 插值中出错。
# - 迁移脚本位于 migrations/versions/，已被 black/isort/ruff/coverage/bandit 豁免。
# ============================================================================

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# 文件名格式：日期_revision前缀_描述，如 20260813_abc123_initial_schema
# 注意：%% 是 ConfigParser 转义，解析后交给 alembic 做 Python % 格式化
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40
output_encoding = utf-8

# 由 migrations/env.py 动态注入（留空占位，不要在此填写连接串）
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s [%(levelname)-5.5s] %(name)s: %(message)s
datefmt = %H:%M:%S
