[project]
name = "tg-guard-bot"
version = "0.1.0"
description = "Telegram 群管理机器人，支持入群验证、群管理和智能反垃圾"
authors = [{name = "tg-guard-bot"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Telegram Bot 框架
    "aiogram>=3.6.0,<4.0.0",

    # 数据库
    "sqlalchemy>=2.0.0,<3.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # Redis
    "redis[hiredis]>=5.0.0",

    # AI/ML
    "scikit-learn>=1.4.0",
    "jieba>=0.42.1",                    # 中文分词
    "onnxruntime>=1.17.0",
    "fastembed>=0.3.0",
    "numpy>=1.26.0",

    # 图片 OCR (可选，需要更多内存)
    # "paddleocr>=2.7.0",
    # "paddlepaddle>=2.6.0",

    # 配置管理
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # 日志
    "loguru>=0.7.0",

    # 工具库
    "aiohttp>=3.9.0",
    "httpx>=0.26.0",
    "psutil>=5.9.0",  # 系统监控
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    # ✅ L4: 安全扫描工具
    "bandit>=1.7.0",      # Python 安全扫描
    "safety>=3.0.0",      # 依赖漏洞检查
]

ocr = [
    "paddleocr>=2.7.0",
    "paddlepaddle>=2.6.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
