# Docker Compose 开发环境覆盖配置
# 此文件会自动与 docker-compose.yml 合并，仅在开发环境中使用
# 生产环境使用: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  bot:
    # 开发环境：与生产统一使用非 root 用户
    user: "1000:1000"

    # 开发环境：挂载源代码与运行时数据（修改后需 make dev-restart 生效）
    volumes:
      - ./src:/app/src:ro           # 只读挂载源代码
      - ./scripts:/app/scripts:ro   # 只读挂载脚本
      - ./migrations:/app/migrations  # 挂载迁移脚本（生成新迁移时需可写）
      - ./locales:/app/locales:ro   # 只读挂载 i18n catalog（修改后需重启 bot）
      - ./pyproject.toml:/app/pyproject.toml:ro  # 只读挂载版本号来源（Sentry release 随版本即时同步）
      - ./data:/app/data            # 挂载整个 data 目录（包含 models 和 session 文件）
      - ./logs:/app/logs
      - ./config:/app/config

    # 开发环境：启用调试日志
    environment:
      - SENTRY_ENVIRONMENT=development
      - SENTRY_TRACES_SAMPLE_RATE=1.0
      - LOG_LEVEL=DEBUG
      - DEBUG=true
      - PYTHONUNBUFFERED=1  # 实时显示输出

    # 开发环境：允许失败时不重启（方便调试）
    restart: "no"

  # 开发环境：暴露数据库和 Redis 端口用于本地调试
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"
