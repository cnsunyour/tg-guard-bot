# Docker Compose 开发环境覆盖配置
# 此文件会自动与 docker-compose.yml 合并，仅在开发环境中使用
# 生产环境使用: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  bot:
    # 开发环境：使用 root 用户运行（允许安装依赖）
    user: "root"

    # 开发环境：挂载源代码以支持热重载
    volumes:
      - ./src:/app/src:ro           # 只读挂载源代码
      - ./scripts:/app/scripts:ro   # 只读挂载脚本
      - ./migrations:/app/migrations:ro  # 只读挂载迁移脚本
      - ./data:/app/data            # 挂载整个 data 目录（包含 models 和 session 文件）
      - ./logs:/app/logs

    # 开发环境：使用 watchfiles 监控文件变化并自动重启
    command:
      - /bin/sh
      - -c
      - |
        echo '🔥 开发模式：已启用热重载'
        echo '📦 安装开发依赖...'
        pip install --no-cache-dir watchfiles && \
        echo '✅ watchfiles 安装完成' && \
        echo '🚀 启动 bot（监控 src/ 目录）' && \
        exec watchfiles --filter python 'python -m src.main' src/

    # 开发环境：启用调试日志
    environment:
      - SENTRY_ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - DEBUG=true
      - PYTHONUNBUFFERED=1  # 实时显示输出

    # 开发环境：允许失败时不重启（方便调试）
    restart: "no"

  # 开发环境：暴露数据库和 Redis 端口用于本地调试
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"
